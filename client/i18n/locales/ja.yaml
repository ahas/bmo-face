        onTwos: 2コマ打ち
      hint:
        floor: 口が開き始めるいちばん小さな音（dBFS）です。
        range: 大きい側からこの分（dB）小さい音から口が開きます。
        open: 大きな音で口が開く度合いです。
        jaw: 開きのうち第1フォルマントが決める割合で、大きいほど「ア」が「イ」より大きく開きます。
        round: 丸い母音（「オ」「ウ」）で口をすぼめる強さです。
        teeth: 歯擦音（「ス」「ッス」）で歯を噛み合わせる強さです。
        tongue: 大きく開いた有声音で舌が見える強さです。
        corners: 表情の口角がいちばん上がったとき、幅30の口の端が動く距離です。
        cues: 時刻付きの文が口の形を変える度合いです。
        attack: 口が開くまでにかかる時間（ms）です。
        release: 口が閉じるまでにかかる時間（ms）です。
        glide: すぼめ、歯、舌が音に追従する時間（ms）です。
        rest: 話が止まったとき、表情の口に戻るまでの時間（ms）です。
        eyePulse: 音の大きさに応じて目が大きくなる強さです。
        eyeOnset: 音が急に始まったとき目が大きくなる強さです。
        eyeSquint: 大きな音が長く続くとき目をしかめる強さです。
        eyeShine: 歯擦音で目の輝きが大きくなる強さです。
        lowHz: 第1フォルマントを探す帯域（Hz）です。
        midHz: 第2フォルマントを探す帯域（Hz）です。
        highHz: 歯擦音を探す帯域（Hz）です。
        jawHz: 第1フォルマントがこの範囲（Hz）の始まりならあごが閉じ、終わりなら完全に開きます。
        roundHz: 丸い母音の2つのフォルマントより上の帯域（Hz）で、この帯域の音がその下より小さいほど口をすぼめます。
        onTwos: 口と目を毎コマではなく2コマに1回描き、アニメーションのように見せます。
    rest:
      title: 休憩中の表情
      key:
