        highHz: 咝音频段
        jawHz: 下巴频段
        roundHz: 撮口频段
        onTwos: 一拍二
      hint:
        floor: 嘴开始张开的最小声音（dBFS）。
        range: 从比大声端小这么多（dB）的声音起，嘴就会张开。
        open: 大声时嘴张开的程度。
        jaw: 张开幅度中由第一共振峰决定的比例，越大"a"比"i"张得越大。
        round: 圆唇元音（"o"、"u"）时嘴撮起的强度。
        teeth: 咝音（"s"、"ss"）时牙齿咬合的强度。
        tongue: 嘴张大的浊音中舌头露出的强度。
        corners: 表情的嘴角完全上扬时，宽度为 30 的嘴的两端移动的距离。
        cues: 带时间的句子改变嘴形的程度。
        attack: 嘴张开所需的时间（ms）。
        release: 嘴闭合所需的时间（ms）。
        glide: 撮口、牙齿、舌头跟随声音的时间（ms）。
        rest: 说话停下时回到表情嘴形的时间（ms）。
        eyePulse: 眼睛随音量变大的强度。
        eyeOnset: 声音突然开始时眼睛变大的强度。
        eyeSquint: 大声持续时眯眼的强度。
        eyeShine: 咝音时眼睛高光变大的强度。
        lowHz: 寻找第一共振峰的频段（Hz）。
        midHz: 寻找第二共振峰的频段（Hz）。
        highHz: 寻找咝音的频段（Hz）。
        jawHz: 第一共振峰位于此范围（Hz）的起点时下巴闭合，位于终点时完全张开。
        roundHz: 圆唇元音两个共振峰之上的频段（Hz），此频段的声音比其下方越小，嘴撮得越紧。
        onTwos: 嘴和眼睛不是每帧都画，而是每两帧画一次，看起来像动画。
    rest:
      title: 休息中的表情
      key:
        blank: 到无表情
        asleep: 到困倦表情
      hint:
        blank: 说完话或做完事后，在这段时间内保持最后的表情，然后变为无表情。
