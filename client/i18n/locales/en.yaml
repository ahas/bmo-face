    tuning:
      title: Sound response
      group:
        sound: Sound
        mouth: Mouth
        time: Timing
        eyes: Eyes
      from: From
      to: To
      key:
        floor: Quietest sound
        range: Sound range
        open: Open
        jaw: Jaw
        round: Round
        teeth: Teeth
        tongue: Tongue
        corners: Mouth corner height
        cues: Caption cues
        attack: Opening time
        release: Closing time
        glide: Follow time
        rest: Rest time
        eyePulse: Loudness
        eyeOnset: Sound onset
        eyeSquint: Long loud sound
        eyeShine: Sibilants
        lowHz: First formant
        midHz: Second formant
        highHz: Sibilant band
        jawHz: Jaw band
        roundHz: Rounding band
        onTwos: On twos
      hint:
        floor: The quietest sound (dBFS) at which the mouth starts to open.
        range: The mouth opens from sounds this much (dB) below the loud end.
        open: How wide the mouth opens on a loud sound.
        jaw: The share of the opening the first formant decides; the higher it is, the wider 'ah' opens than 'ee'.
        round: How strongly the mouth rounds on round vowels ('oh', 'oo').
        teeth: How strongly the teeth meet on sibilants ('s', 'ss').
        tongue: How strongly the tongue shows on wide-open voiced sounds.
        corners: How far the ends of a mouth 30 wide move when the expression's mouth corners rise all the way.
        cues: How much timed sentences change the mouth's shape.
        attack: The time (ms) the mouth takes to open.
        release: The time (ms) the mouth takes to close.
        glide: The time (ms) rounding, teeth and tongue take to follow the sound.
        rest: The time (ms) to return to the expression's mouth when speech pauses.
        eyePulse: How strongly the eyes grow with loudness.
        eyeOnset: How strongly the eyes grow when a sound starts suddenly.
        eyeSquint: How strongly the eyes squint when a loud sound goes on.
        eyeShine: How strongly the eye shine grows on sibilants.
        lowHz: The band (Hz) the first formant is looked for in.
        midHz: The band (Hz) the second formant is looked for in.
        highHz: The band (Hz) sibilants are looked for in.
        jawHz: When the first formant is at the start of this range (Hz) the jaw is closed, and at its end fully open.
        roundHz: The band (Hz) above a round vowel's two formants; the quieter this band is than the sound below it, the more the mouth rounds.
        onTwos: Draws the mouth and eyes every second frame instead of every frame, so it looks like animation.
