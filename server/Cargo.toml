# BMO's face server (docs/face.md, 「The server」): the expression document, the editor's sessions,
# the generated screen and the tool entry, as the workspace's one crate.

[package]
name = "bmo-face"
version.workspace = true
description = "BMO's face: the server, the expression document's keeping and the expression tool entry."
edition.workspace = true
license.workspace = true
publish.workspace = true
# One test target, the harness at tests/main.rs (bmo-chat's docs/conventions.md, 「Rust builds」).
autotests = false

[[bin]]
name = "bmo-face"
path = "src/main.rs"

[dependencies]
# The face's core: the expression document's check, its carrying from older forms and its default.
bmo-face-core = { path = "../core" }
# The console face the console plugin contract asks of a service: its manifest, its bundle's files, its
# words and their guard, served by bmo-chat's shared crate.
bmo-console-face = { path = "../../../base/chat/console-face" }
# The editor's password, checked against the Argon2 hash BMO writes into `web_users`.
argon2 = { version = "0.5.3", features = ["std"] }
# The `Cookie` header read as browsers write it.
cookie = "0.18.1"
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
futures-util = "0.3.34"
http-body-util = "0.1.3"
hyper = { version = "1.12.0", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["client", "client-legacy", "client-proxy", "client-proxy-system", "http1", "http2", "server", "service", "tokio"] }
mime_guess = "2.0.5"
percent-encoding = "2.3.1"
rand = "0.9.2"
# The document keeps its keys in the order they were written, as the screen and the file read it, and
# every number exactly as written, as JavaScript reads it.
serde_json = { version = "1.0.138", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.10.9"
# BMO's archive on either database it stands in, and this server's own session database.
sqlx = { version = "0.8.6", default-features = false, features = ["any", "postgres", "sqlite", "runtime-tokio"] }
tokio = { version = "1.53.3", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
url = "2.5.8"

[dev-dependencies]
libc = "0.2.177"
tempfile = "3.20.0"
toml = "0.8.23"

[[test]]
name = "main"
path = "tests/main.rs"
