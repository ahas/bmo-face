# How the testbed tests, checks, builds and deploys this repository, in the testbed's declaration format.

testbed = 0
name = "bmo-face"

[test]
# The server's crate, and the Bun test files of the root project: the expression document's check,
# its fixtures and the development copy. The screen under client/ is a project of its own, whose
# check script is its typecheck and its domain tests.
languages = ["cargo", "bun"]
setup = ["bun install --frozen-lockfile", "cd client && bun install --frozen-lockfile"]

[check]
# The sweeps that read the tree before anything runs: Korean in the code, the README's folder table and
# the dependencies the manifests name. The ledger is the Korean left in a code file. The face reaches
# BMO's archive and console as a configured address, never as another repository's code. Its two base
# libraries serve the console screen alone: bmo-ui, vendored for the bundle, and bmo-chat's
# bmo-console-face crate in the server.
quick = ["korean", "layout", "dependencies", "cargo-profile", "shared-versions"]
korean_ledger = "korean-ledger.json"
base_libraries = ["bmo-ui", "bmo-console-face"]

# The repository whose root holds the shared versions the manifests and the lock hold to.
[check.shared_versions]
repository = "bmo-chat"

[[check.step]]
id = "check"
command = "cargo check --workspace --all-targets"
lane = "wide"

[[check.step]]
id = "clippy"
command = "cargo clippy --workspace --all-targets -- -D warnings"
lane = "wide"

[[check.step]]
id = "fmt"
command = "cargo fmt --all --check"

[[check.step]]
id = "types"
command = "bun run check:types"

# The server's binary and the native displayer's go into a release's bin/.
[build]
binaries = ["bmo-face", "bmo-face-displayer"]

# The face's own deploy tree and the shared data root its document and session database stand under.
[deploy]
root = "~/.local/share/bmo-face"
link = "deploy"
data_root = "~/.local/share/bmo/data"
units = ["deploy/*.service"]
# Answers 0 once the server answers its document and serves the generated screen.
health = '''curl -sf http://127.0.0.1:3217/bmo-face/api/faces >/dev/null && curl -sf http://127.0.0.1:3217/bmo-face/ | grep -qi '<html' '''

# The console face the deployment probes once the server is up (docs/deploy.md, 「The console probe」):
# the server's loopback address under /bmo-face, the console's credential from the host's environment
# file under the data root, and, since the face holds no token of its own, a value made new for each run
# in its place, which the console's routes refuse as they refuse every credential but the console's.
[deploy.console]
reach = '''
set -eu
data="${BMO_DATA_DIR:-$HOME/.local/share/bmo/data}"
set -a
. "$data/env/face.env"
set +a
jq -nc \
  --arg address "http://127.0.0.1:3217/bmo-face" \
  --arg consoleToken "$BMO_FACE_TOKEN" \
  --arg token "$(od -An -tx1 -N24 /dev/urandom | tr -d ' \n')" \
  '{address: $address, consoleToken: $consoleToken, token: $token}'
'''

# The screen and the console bundle, built into the release where the server serves them from beside
# the binary; the bundle after the screen, whose generation empties the output folder first.
[[deploy.step]]
id = "screen"
phase = "before-flip"
command = "cd client && bun run generate && bun run console"

# The tool entry placed with the tool host once the service answers: the release's binary, manifest and
# schemas as one folder, registered as this service's own.
[[deploy.step]]
id = "register-tool"
phase = "after-health"
command = '''
set -eu
rm -rf .tool
mkdir -p .tool
cp bin/bmo-face tool.toml expression.json expression-shown.json .tool/
bmo pocket put .tool --placed --service bmo-face
rm -rf .tool
'''
