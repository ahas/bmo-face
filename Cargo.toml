# The Cargo workspace: the face's core, which reads the expression document and answers the drawing
# shown at every frame, and the server with its tool entry, built on it. The root Bun project holds the
# document's TypeScript statement, the core's WebAssembly build and the scripts; the screen under client/
# is a Bun project of its own.

[workspace]
resolver = "3"
members = ["core", "displayer", "server"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
strip = "debuginfo"
incremental = false

# The editor's password check, unoptimised, takes most of a second a login, which the tests make
# dozens of.

[profile.test.package."*"]
debug = false

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
debug = false
strip = "debuginfo"

# The core's WebAssembly build, optimised for size (docs/face.md, 「The face's core」).
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
