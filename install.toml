# What installing the face on a fresh machine needs, read by the testbed's install verb (bmo-testbed's
# docs/install.md, 「The install declaration」). Its environment is docs/face.md's 「The server」 and docs/deploy.md's
# 「What a deployment does」.

install = 1

restart = "systemctl --user restart bmo-face.service"

[[needs]]
program = "cargo"
what = "Builds the server and the native displayer; the Rust toolchain from https://rustup.rs."

[[needs]]
program = "bun"
what = "Installs the packages and generates the screen and the console bundle at every release; the Bun runtime from https://bun.sh."

[[port]]
name = "face.server"
number = 3217

# The credential the console calls the console routes with; the face holds no token of its own.
[[token]]
name = "face.console"
file = "env/face-console.token"

# The server's settings file, env/face.env, which the server, its health and its console reach read: the port the
# install chose for the server, the console's credential and the console the listener routes pass through to, on its loopback port under its base
# path. The archive the editor's login reads is the address the
# data root's env/archive-url holds, read where this file names none.
[[settings]]
file = "env/face.env"
text = """
BMO_FACE_PORT={{port.face.server}}
BMO_FACE_TOKEN={{token.face.console}}
BMO_CONSOLE_URL=http://127.0.0.1:{{port.web.console}}/bmo
"""

# The face's two proxy locations, written with the port the install chose (docs/deploy.md, 「The proxy」). The display
# on another screen reaches the face through this machine's web server alone, which includes the file once.
[[settings]]
file = "proxy/bmo-face.conf"
mode = "644"
text = '''
location = /bmo-face { return 308 /bmo-face/; }
location /bmo-face/ {
  proxy_pass http://127.0.0.1:{{port.face.server}};
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_buffering off;
  proxy_read_timeout 3600s;
}
'''

[[line]]
file = "env/web-console.env"
key = "FACE_ADDRESS"
value = "http://127.0.0.1:{{port.face.server}}/bmo-face"

[[line]]
file = "env/web-console.env"
key = "FACE_TOKEN"
value = "{{token.face.console}}"

# This machine's nginx serves the proxy locations the install wrote.
[[verify]]
id = "proxy"
what = "This machine's nginx does not include the proxy locations the install wrote: a person with root adds `include <data root>/proxy/*.conf;` inside the server block that serves the console and reloads nginx; the install never edits a reverse proxy."
run = '''
set -eu
grep -rqsF "${BMO_DATA_DIR:-$HOME/.local/share/bmo/data}/proxy/" /etc/nginx/
'''
